[project]
name = "emporio-agent"
version = "0.1.0"
description = "Agente de atendimento por mensagens de texto da Empório da Música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.70",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
emporio-agent = "emporio_agent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emporio_agent"]

[tool.pytest.ini_options]
testpaths = ["tests/e2e"]
markers = ["e2e: teste ponta a ponta contra o LLM real"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
